<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>子午 Ziwu</title>
  <style>
    html {
      --boot-bg-light: #e8edf2;
      --boot-bg-dark: #04060a;
      background-color: var(--boot-bg-light);
      color-scheme: light;
    }

    html.dark {
      background-color: var(--boot-bg-dark);
      color-scheme: dark;
    }

    @media (prefers-color-scheme: dark) {
      html:not(.light) {
        background-color: var(--boot-bg-dark);
        color-scheme: dark;
      }
    }
  </style>
  <script src="./theme-boot.js"></script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>

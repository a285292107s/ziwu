<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!--
    刻意不加 <base target="_blank">。
    磁贴的跳转行为由 ShortcutTile 的 openInNewTab 决定（这里不传 = 同标签页），
    避免出现「有的链接同标签页、有的链接新标签页」这种页内不一致。
    Ctrl/⌘+点击、中键点击依旧是浏览器原生的新标签页行为。
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>子午 Meridiem</title>
  <!--
    时钟字体的 <link rel="preload"> 由 vite.config.mts 的 clock-font-preload 插件
    在构建时注入：产物文件名带内容哈希，源码里写不出来。
  -->
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
